<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="70" y="24" font-size="13" font-weight="600" fill="#0f172a">受理速率 vs 实际入库速率（单节点，8 分区 / 8 消费线程）</text>
  <text x="70" y="40" font-size="11" fill="#64748b">虚线为「全量入库」参考线；实测点落在其下方 = 消费侧开始积压</text>

  <!-- 网格与坐标轴 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="330" x2="650" y2="330"/>
    <line x1="70" y1="257.5" x2="650" y2="257.5"/>
    <line x1="70" y1="185" x2="650" y2="185"/>
    <line x1="70" y1="112.5" x2="650" y2="112.5"/>
    <line x1="70" y1="40" x2="650" y2="40"/>
    <line x1="70" y1="40" x2="70" y2="330"/>
  </g>

  <!-- 刻度 -->
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <text x="60" y="334">0</text>
    <text x="60" y="261">5k</text>
    <text x="60" y="189">10k</text>
    <text x="60" y="116">15k</text>
    <text x="60" y="44">20k</text>
  </g>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="70" y="348">0</text>
    <text x="215" y="348">5k</text>
    <text x="360" y="348">10k</text>
    <text x="505" y="348">15k</text>
    <text x="650" y="348">20k</text>
  </g>
  <text x="360" y="368" font-size="11" fill="#475569" text-anchor="middle">受理速率（点/s）</text>
  <text x="18" y="185" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 18 185)">入库速率（点/s）</text>

  <!-- 1:1 参考线 -->
  <line x1="70" y1="330" x2="650" y2="40" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="612" y="60" font-size="10" fill="#94a3b8" text-anchor="end">1:1 全量入库</text>
  <line x1="96" y1="308" x2="126" y2="308" stroke="#2563eb" stroke-width="2.4"/>
  <text x="132" y="312" font-size="10" fill="#1e40af">实测（4 档阶梯，每档 90s 稳态）</text>

  <!-- 上限参考线（实测处理上限 ≈10.5k） -->
  <line x1="70" y1="177.75" x2="650" y2="177.75" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="652" y="164" font-size="10" fill="#b45309" text-anchor="end">处理上限 ≈ 10.5k 点/s</text>

  <!-- 实测折线 -->
  <polyline points="148.2,284.3 223.2,241.2 378.1,167.2 588.6,180.6"
            fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="148.2" cy="284.3" r="4.5"/>
    <circle cx="223.2" cy="241.2" r="4.5"/>
    <circle cx="378.1" cy="167.2" r="4.5"/>
    <circle cx="588.6" cy="180.6" r="4.5" fill="#dc2626"/>
  </g>

  <!-- 数据标签 -->
  <g font-size="10" fill="#1e40af">
    <text x="148.2" y="300" text-anchor="middle">2.7k</text>
    <text x="223.2" y="231" text-anchor="middle">5.3k</text>
    <text x="378.1" y="158" text-anchor="middle">10.6k / 11.2k</text>
    <text x="588.6" y="199" text-anchor="middle" fill="#b91c1c" font-weight="600">17.9k / 10.3k</text>
  </g>

  <!-- 说明 -->
  <g font-size="10.5" fill="#475569">
    <text x="398" y="128" fill="#b91c1c">缺口 41%，lag 涨到 4363 批</text>
    <text x="96" y="80">S1/S2 的入库高于受理，</text>
    <text x="96" y="94">是上一档积压的排空，不是超能力</text>
  </g>

</svg>
