<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="680" height="260" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="70" y="24" font-size="13" font-weight="600" fill="#0f172a">每批耗时拆解：逐行 INSERT → 单条多行 INSERT（4C8G / 4 线程 / 30 点每批）</text>
  <text x="70" y="40" font-size="11" fill="#64748b">墙钟分段（ft_processor_stage_seconds）；db_points 18.85 → 3.48ms（-82%），单批 33.03 → 13.97ms，db_segment 升为新大头</text>

  <!-- 刻度：x 150–630 → 480px / 35ms = 13.71px/ms -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="70" x2="150" y2="196"/>
    <line x1="287.1" y1="70" x2="287.1" y2="196"/>
    <line x1="424.3" y1="70" x2="424.3" y2="196"/>
    <line x1="561.4" y1="70" x2="561.4" y2="196"/>
    <line x1="630" y1="70" x2="630" y2="196"/>
  </g>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="150" y="210">0</text>
    <text x="287" y="210">10ms</text>
    <text x="424" y="210">20ms</text>
    <text x="561" y="210">30ms</text>
    <text x="630" y="210">35</text>
  </g>

  <!-- 行标签 -->
  <text x="142" y="100" font-size="11" fill="#475569" text-anchor="end">修复前 33.03ms</text>
  <text x="142" y="180" font-size="11" fill="#475569" text-anchor="end">修复后实测</text>
  <text x="142" y="196" font-size="10" fill="#94a3b8" text-anchor="end">（同口径 E1）</text>

  <!-- 修复前条：db_points 258.5 / clean 81.3 / db_segment 75.7 / redis 23.3 / commit 5.5 / 其他 8.6 -->
  <rect x="150"   y="86" width="258.5" height="28" fill="#dc2626"/>
  <rect x="408.5" y="86" width="81.3"  height="28" fill="#f59e0b"/>
  <rect x="489.8" y="86" width="75.7"  height="28" fill="#fb923c"/>
  <rect x="565.5" y="86" width="23.3"  height="28" fill="#3b82f6"/>
  <rect x="588.8" y="86" width="5.5"   height="28" fill="#10b981"/>
  <rect x="594.3" y="86" width="8.6"   height="28" fill="#94a3b8"/>

  <g font-size="10" fill="#ffffff" text-anchor="middle">
    <text x="279" y="104" font-weight="600">db_points 18.85ms · 57%</text>
  </g>
  <g font-size="10" fill="#7c2d12" text-anchor="middle">
    <text x="449" y="104">clean 5.93</text>
    <text x="527" y="104">segment 5.52</text>
  </g>
  <text x="610" y="104" font-size="10" fill="#334155">Redis 1.7</text>

  <!-- 修复后实测条（E1，c=4）：db_points 3.48 / clean 2.04 / db_segment 5.57 / redis 2.12 / commit 0.68 / 其他 0.08 → 总 13.97ms -->
  <rect x="150"   y="166" width="47.7" height="28" fill="#dc2626"/>
  <rect x="197.7" y="166" width="28.0" height="28" fill="#f59e0b"/>
  <rect x="225.7" y="166" width="76.4" height="28" fill="#fb923c"/>
  <rect x="302.1" y="166" width="29.1" height="28" fill="#3b82f6"/>
  <rect x="331.2" y="166" width="9.3"  height="28" fill="#10b981"/>
  <rect x="340.5" y="166" width="1.1"  height="28" fill="#94a3b8"/>
  <text x="355" y="178" font-size="10" fill="#334155">db_points 3.48ms（-82%）；db_segment 5.57ms 成为新大头（40%）</text>
  <text x="355" y="192" font-size="10" fill="#475569">实测总耗时 13.97ms（优于预期 ~18ms）→ 排空吞吐 168 → 356 批/s</text>

  <!-- 图例 -->
  <g font-size="10">
    <rect x="150" y="226" width="10" height="10" fill="#dc2626"/>
    <text x="165" y="235" fill="#475569">写点 db_points（修复前逐行 / 修复后单条多行 INSERT）</text>
    <rect x="290" y="226" width="10" height="10" fill="#f59e0b"/>
    <text x="305" y="235" fill="#475569">清洗 + 状态加载</text>
    <rect x="425" y="226" width="10" height="10" fill="#fb923c"/>
    <text x="440" y="235" fill="#475569">分段 DELETE+INSERT</text>
    <rect x="575" y="226" width="10" height="10" fill="#3b82f6"/>
    <text x="590" y="235" fill="#475569">Redis ×4</text>
    <rect x="150" y="244" width="10" height="10" fill="#10b981"/>
    <text x="165" y="253" fill="#475569">PG 提交残差（含 fsync）</text>
    <rect x="290" y="244" width="10" height="10" fill="#94a3b8"/>
    <text x="305" y="253" fill="#475569">decode / 其他</text>
  </g>
</svg>
