syntax = "proto3";

package flowtrace.internal.v1;

// Kafka 内部消息（flowtrace-upload 写入，flowtrace-processor 消费），点为绝对坐标（×1e7）
// topic trace.batch.v1 消息 value；Kafka 头：
//   bId=batchId（十进制字符串，便于运维检索）
//   ch=1|2（通道）
message TraceBatchMessage {
  string batch_id = 1;        // 幂等键（唯一索引防重）
  string schema_version = 2;  // 透传自上报批头
  string device_id = 3;       // Kafka 分区键之一（与 user_id 共同保证同设备有序）
  string user_id = 4;         // Kafka 分区键之一
  string session_id = 5;      // 采集会话 ID，透传
  string task_id = 6;         // 业务任务关联，透传
  int32 channel = 7;          // 1 realtime / 2 backfill（见 trace.proto Channel）
  int64 received_ts_ms = 8;   // flowtrace-upload 接收时刻（对账/延迟分析用）
  repeated AbsolutePoint points = 9;
}

message AbsolutePoint {
  int64 ts_ms = 1;            // epoch 毫秒（解码后绝对值）
  int32 lat_q = 2;            // 纬度 ×1e7（= round(度 × 10^7)）
  int32 lng_q = 3;            // 经度 ×1e7
  int32 accuracy_cm = 4;      // 0 = 缺省
  float speed_mps = 5;        // 0 = 缺省
  int32 bearing_deg = 6;      // 0 = 缺省
  int32 altitude_cm = 7;      // 0 = 缺省（WGS84 海拔 cm）
  int32 source = 8;           // LocationSource 数值，0 = UNSPECIFIED
  uint32 flags = 9;           // 位掩码（见 trace.proto 顶部标志位定义）
  int32 idx = 10;             // 批内序号（pointId = UUIDv5(ns, "{batchId}:{idx}") 派生入参）
}
