# 版本目录：集中管理后端依赖版本（版本来源：Spring Initializr 种子 + Maven Central / Plugin Portal 最新稳定版）

[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
ktlint = "14.2.0"
exposed = "1.0.0-beta-4"
jts = "1.20.0"
# protobuf 运行时与 protoc 工具版本必须一致
protobuf = "4.36.2"
protobuf-plugin = "0.10.1"

[libraries]
# Spring Boot BOM：普通模块以 platform() 引入，统一管理 starter 及传递依赖版本
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
# Exposed BOM：storage-postgres 使用；1.0.0-beta 线提供 exposed-migration 模块管理 DDL 变更
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
# JTS：抽稀/里程/分段等空间计算，全部在应用层（processor/query）完成
jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jts" }
# Protobuf 运行时：trace-protocol 生成 Kotlin DSL 代码依赖（传递引入 protobuf-java）
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
