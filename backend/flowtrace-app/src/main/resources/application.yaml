# FlowTrace 默认配置 —— 口径契约见 docs/design/07-deploy-observability.md §3
# 敏感项（凭据）以 ${ENV:默认值} 占位符引用部署注入的环境变量，不在本文件写死；
# 所有键均可被环境变量按 relaxed binding 覆盖（如 flowtrace.upload.topic -> FLOWTRACE_UPLOAD_TOPIC，
# 注意连字符会被去掉：ts-window-rt-past-ms -> FLOWTRACE_UPLOAD_TSWINDOWRTPASTMS）。

spring:
  application:
    name: flowtrace-app
  datasource:
    # PostgreSQL 本地另行安装（07 §1.1）；URL 按写入路径约定带 reWriteBatchedInserts（06 §39）
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowtrace?reWriteBatchedInserts=true}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin123}  # 测试环境明文默认值；生产务必用 Secret / 环境变量覆盖
    hikari:
      maximum-pool-size: 10            # 原 DB_POOL_MAX（Hikari 默认）
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: 8080

logging:
  level:
    root: ${LOG_LEVEL:info}
    dev.yidafu.flowtrace: info

management:
  tracing:
    sampling:
      probability: 0.1                 # 入口 10% + 错误全采（07 §5）
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
  # 指标抓取入口：本地 Prometheus（deploy/prometheus/prometheus.yml）打 /actuator/prometheus。
  # 不配 exposure 时 actuator 只暴露 health，抓取会一直 404 → target down。
  # 与业务接口同端口（未设 management.server.port）；生产建议独立内网端口并禁止网关转发 /actuator/**。
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: flowtrace          # 全局标签：多实例/多环境聚合时区分服务
    distribution:
      # Timer 默认只输出 count/sum/max，没有分位数；不开 histogram 则 07 §4 的 p95/p99 告警全是空的
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,500ms,1s

flowtrace:
  postgres:
    ddl-auto: create               # none=不建表（默认，测试用）；create=启动时用 SchemaUtils.create 补建缺失表
  auth:
    jwks-issuer:                       # 部署期必填（外部 IdP 签发，服务仅持 JWKS 公钥）
    jwks-cache-ttl-sec: 300
  kafka:
    send-timeout-sec: 5                # upload 同步等待 Kafka 确认的超时，超时回滚幂等 key 并 5xx
  log:
    # 请求日志（infra/common/web HttpRequestLoggingFilter）
    request-enabled: true              # 每个请求一行访问日志
    payload-on-error: true             # 4xx/5xx 额外打印入参/出参（坐标已脱敏，07 §5）
    max-payload-chars: 2048            # 单个载荷落日志的最大字符数，超出截断
  upload:
    topic: trace.batch.v1
    limit-batch-per-min-rt: 12         # 实时通道 批次/分钟
    limit-batch-per-min-bf: 6          # 补传通道 批次/分钟
    limit-points-per-min: 6000
    degrade-threshold-pct: 90
    degrade-windows: 10
    degraded-factor: 2
    max-points-rt: 100                 # 实时通道单批点数上限（06 §2.3）
    max-points-bf: 500                 # 补传通道单批点数上限（06 §2.3）
    payload-max-bytes: 262144          # 256KB
    gunzip-max-bytes: 2097152
    ts-window-rt-past-ms: 172800000    # 2d
    ts-window-bf-past-ms: 604800000    # 7d
    ts-window-future-ms: 600000        # 10min
    interval-base-sec: 30
    interval-high-sec: 60
    interval-veryhigh-sec: 120
    interval-limited-sec: 300
    interval-min-sec: 10
    interval-max-sec: 300
  processor:
    consumer-group: processor-group    # 与 realtime 分键，避免多模块单体撞名
    concurrency: 8                     # = trace.batch.v1 实际分区数；大于分区数只会让多余线程空转
    poll-records: 100
    watermark-drift-ms: 600000         # 10min 乱序水位窗口
    clean-accuracy-cm: 10000
    clean-accuracy-lone-ms: 600000
    clean-speed-max-mps: 85
    split-gap-ms: 600000
    split-jump-m: 5000
    stay-radius-m: 50
    stay-min-ms: 300000
    stay-merge-gap-ms: 120000
    dp-storage-epsilon-m: 5
    points-write-batch: 1000
    open-seg-max-points: 5000          # 单段点数上限，达到即强制分段（08 §8.5）
    device-state-cache-size: 2000      # 每 consumer 的设备状态 LRU 容量
    future-ms: 600000                  # 未来时间容忍（清洗规则）
    batch-timeout-ms: 60000            # 单批墙钟上限，超过按毒丸投 DLQ（06 §3.7）
    retry-backoff-ms: 2000             # 可重试异常退避起值（无限重试）
    dlq-max-retries: 3
    dlq-topic: trace.batch.dlq.v1
    recalc-lock-ttl-sec: 300
    dirty-scan-interval-sec: 60
    segment-finalize-interval-sec: 300 # OPEN 段兜底收尾扫描间隔（06 §3.4）
    segment-finalize-batch: 500        # 单次封口上限（框住单事务锁行数）
  realtime:
    consumer-group: realtime-group
    pos-ttl-days: 30
  query:
    span-max-traces-days: 7
    span-max-segments-days: 31
    span-max-distance-days: 31
    span-max-playback-days: 1
    limit-points-default: 2000
    limit-points-max: 5000
    location-stale-ms: 300000
  admin:
    partition-precreate-days: 3
    partition-cron: "0 5 0 * * *"
    archive-enabled: true
    archive-bucket: ${ARCHIVE_BUCKET:} # 对象存储凭据经 Secret 注入
    retention-point-days: 30           # 全局默认，可被 USER 策略覆盖
    retention-segment-days: 180
    retention-archive-days: 365
